# Shared tmux config for all ttyd browser-terminal harnesses.
# Bind-mounted read-only to /root/.tmux.conf via docker-compose (no rebuild).

# Mouse OFF on purpose: with tmux mouse capture disabled, the browser/xterm.js
# owns the mouse, so a plain drag makes a NATIVE browser selection that the ttyd
# page's lab-kbfix handler copies straight to your OS clipboard (reliable —
# happens inside your click gesture). With mouse ON, tmux grabbed the drag and
# tried OSC 52, which browsers drop. Trade-off: no mouse-wheel scroll in tmux
# (full-screen apps like Claude/Crush still scroll with their own keys/PgUp).
set -g mouse off

# Big scrollback so long agent output isn't lost.
set -g history-limit 50000

# Still let terminal tools that emit their own OSC 52 clipboard escapes push
# them through to the browser (lab-kbfix bridges those too).
set -g allow-passthrough on
set -g set-clipboard on
set -as terminal-features ',*:clipboard'
set -ag terminal-overrides ',*:Ms=\E]52;%p1%s;%p2%s\7'

# Snappier UI in a browser terminal.
set -g escape-time 10
set -g default-terminal "tmux-256color"
