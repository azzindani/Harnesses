# Shared tmux config for all ttyd browser-terminal harnesses.
# Bind-mounted read-only to /root/.tmux.conf via docker-compose (no rebuild).

# Mouse: scroll-wheel scrollback, click to position the cursor / select panes,
# and drag to select text. Plain drag copies into tmux's own buffer.
#   → To copy to YOUR computer's clipboard, hold SHIFT while dragging (this
#     bypasses tmux and uses the browser's native selection), then Ctrl+Insert
#     or right-click → Copy.
set -g mouse on

# Big scrollback so long agent output isn't lost.
set -g history-limit 50000

# Keep the selection visible after a mouse drag instead of jumping to the
# bottom, so you can right-click → Copy what you just highlighted.
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-selection-no-clear
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear

# Let terminal tools (e.g. Claude Code) push their own clipboard/OSC escapes
# straight through tmux to the browser.
set -g allow-passthrough on
set -g set-clipboard on

# Advertise OSC 52 clipboard support so tmux actually EMITS an OSC 52 escape
# when you drag-select (the ttyd page's lab-kbfix handler turns that into a
# real OS-clipboard write). Without this, set-clipboard has nothing to send.
set -as terminal-features ',*:clipboard'
set -ag terminal-overrides ',*:Ms=\E]52;%p1%s;%p2%s\7'

# Snappier UI in a browser terminal.
set -g escape-time 10
set -g default-terminal "tmux-256color"
