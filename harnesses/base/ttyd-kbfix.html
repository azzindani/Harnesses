<script>
/* lab-kbfix: clipboard copy/paste + mobile UX for the ttyd browser terminal.

   Desktop mechanisms (already present):
   1. OSC 52 bridge — tmux `set-clipboard on` emits OSC 52; we decode and write
      it to the OS clipboard so drag-select inside tmux "just works".
   2. Copy-on-selection — xterm-owned selections (Shift+drag past a TUI's mouse
      capture) are auto-copied on selection-change.
   2b. mouseup copy — reliable copy after drag settles.
   3. Ctrl+C / Ctrl+V key handling.

   Mobile additions:
   4. touchend copy — mirrors mouseup so touch-selections are auto-copied.
   5. URL link provider — registerLinkProvider makes every http/https URL in the
      terminal output click/tap-able; tap opens in a new tab.
   6. Mobile panel — a floating 📋 button (only shown on touch devices) opens a
      panel with the visible terminal text in a native <textarea> (fully
      selectable on mobile) plus a tappable list of URLs found in that text.
      Tap "Copy all" to copy everything; long-press in the textarea to select
      any range with the native handles.
   7. Scroll bridge — mouse-wheel / touch-drag scrolling of the actual chat
      history in full-screen TUIs (Claude Code, opencode). Those apps run on
      the terminal's alternate screen buffer, which by spec has no scrollback
      of its own (not tmux's history-limit, not xterm.js's local buffer) --
      the app manages its own scrollable viewport, driven by real key input
      (PageUp/PageDown -- confirmed empirically against both apps). On
      wheel/touch-drag (gated to the alternate screen only; a plain shell
      prompt is left to xterm.js's normal local scrollback), we synthesize a
      real PageUp/PageDown KeyboardEvent and dispatch it at term.textarea --
      the exact element xterm.js itself listens on for physical typing, so it
      flows through the identical path a real keypress would and xterm picks
      the correct escape variant for whatever mode the app has set. (Tried
      first: term.input() -- not exposed on this ttyd build's xterm.js, it's
      gated behind the "proposed API" flag; term.paste() -- sanitizes/strips
      the ESC byte, so raw SGR mouse escapes never survive it. Both confirmed
      via a real headless-browser run against a live session, which is also
      how the KeyboardEvent approach below was verified end-to-end.)
   8. On-screen key toolbar (touch devices only) — the keys a mobile on-screen
      keyboard doesn't have, Termius/Termux-style. Esc / Ctrl / Tab / "/" and
      the four arrows are always on screen, on two rows of the same small keys
      as before; PgUp / PgDn / Home / End / Alt / Shift wait behind
      the ⌃ key, which opens a row above the bar. (The first version scrolled
      a single row sideways behind a 26px-wide chevron: too small to hit, and
      everything past the arrows was effectively hidden.) Ctrl/Alt/Shift are
      one-shot sticky toggles: tap to arm, then the *next* keypress (physical
      or another toolbar button) gets that modifier merged in, via the same
      attachCustomKeyEventHandler hook used for Ctrl+C/V (#3).
   9. Auto-reconnect — ttyd's client only auto-retries the websocket on an
      abnormal close; a clean close (code 1000, which is what a backgrounded
      mobile tab typically gets) instead shows a "Press Enter to Reconnect"
      overlay and waits for a real keypress. We detect that overlay and
      synthesize the Enter keypress so reconnecting after backgrounding/
      reopening the tab needs no manual action (not even a page reload).
  10. Stuck-connection watchdog — the retry in #9 (and ttyd's own) is a SINGLE
      attempt against a socket that may fail for a reason a keypress can't
      fix: the harness container was idle-stopped and is cold-starting (the
      auth service blocks 3-7s on /verify, and the WS attempt can lose that
      race), the phone changed network, or the session cookie needed the
      refresh that only a full document request can pick up. Whenever the
      "Connection Closed" / "Reconnecting..." overlay stays up for more than
      ~12 visible seconds, reload the page: that replays the whole flow
      (cookie → forward_auth → container start → ttyd → `tmux attach`), which
      always lands back in the SAME tmux session, whereas a stuck overlay
      needs a manual reload anyway. Capped at 3 reloads per 2 minutes
      (sessionStorage) so a genuinely dead backend can't put the tab in a
      reload loop; hidden tabs never reload, and their clock only starts once
      the tab is visible again.
  11. Key sizing — ttyd's page has no viewport meta tag, so a phone lays it
      out about 980 CSS px wide and shrinks it onto the screen: the toolbar
      keys came out 15x14px on a 390px-wide phone. They are sized in
      `--lab-u` (CSS px per screen px) instead, about 32px tall on any phone.
      The 📋 button and its panel (#6) keep their CSS sizes.
  12. Keyboard awareness — iOS Safari, and Android Chrome by default, shrink
      only the *visual* viewport when the on-screen keyboard opens, so the
      fixed key toolbar and the terminal's bottom rows (the prompt) sat behind
      the keyboard. On every visualViewport resize/scroll the toolbar is pinned
      just above the keyboard and the terminal is resized to the space above
      the toolbar, so ttyd refits it and the prompt stays in view. With the
      keyboard closed the same layout stops the toolbar covering the
      terminal's last rows.
*/
(function () {
  function decodeUtf8(s) { try { return decodeURIComponent(escape(s)); } catch (e) { return s; } }

  function writeClipboard(text) {
    if (text && navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(function () {});
      return true;
    }
    return false;
  }

  function ready(fn) {
    if (window.term &&
        window.term.element &&
        typeof window.term.attachCustomKeyEventHandler === 'function') {
      fn(window.term);
    } else {
      setTimeout(function () { ready(fn); }, 150);
    }
  }

  ready(function (term) {
    var installed = [];

    /* Shared: synthesize a real KeyboardEvent on term.textarea -- the exact
       element xterm.js listens on for physical typing, so this flows through
       the identical path a real keypress would (needed since term.input()/
       paste() can't carry this, see #7/#8 in the header comment). Used by
       the Ctrl+C/V handler's sticky-modifier support (#3), the scroll bridge
       (#7), and the on-screen key toolbar (#8). */
    var taEl = term.textarea || term.element;
    var synthesizing = false;
    function sendKey(key, code, keyCode, mods) {
      mods = mods || {};
      var opts = {
        key: key, code: code, keyCode: keyCode, which: keyCode,
        ctrlKey: !!mods.ctrl, altKey: !!mods.alt, shiftKey: !!mods.shift,
        bubbles: true, cancelable: true
      };
      synthesizing = true;
      taEl.dispatchEvent(new KeyboardEvent('keydown', opts));
      taEl.dispatchEvent(new KeyboardEvent('keyup', opts));
      synthesizing = false;
    }

    /* One-shot sticky Ctrl/Alt/Shift, armed by the key-toolbar (#8) and
       consumed by the next keypress -- either a real one (intercepted in
       #3's attachCustomKeyEventHandler) or another toolbar tap. */
    var armed = { ctrl: false, alt: false, shift: false };
    var armedListeners = [];
    function armedActive() { return armed.ctrl || armed.alt || armed.shift; }
    function setArmed(k, v) {
      armed[k] = v;
      armedListeners.forEach(function (fn) { try { fn(); } catch (e) {} });
    }
    function consumeArmed() {
      var m = { ctrl: armed.ctrl, alt: armed.alt, shift: armed.shift };
      if (armedActive()) { armed.ctrl = armed.alt = armed.shift = false; armedListeners.forEach(function (fn) { try { fn(); } catch (e) {} }); }
      return m;
    }

    /* 1. OSC 52 -> OS clipboard. tmux emits "52;c;<base64>" on copy. */
    try {
      if (term.parser && typeof term.parser.registerOscHandler === 'function') {
        term.parser.registerOscHandler(52, function (data) {
          try {
            var semi = data.indexOf(';');
            var b64 = semi >= 0 ? data.slice(semi + 1) : data;
            if (b64 && b64 !== '?') writeClipboard(decodeUtf8(atob(b64)));
          } catch (e) {}
          return true;
        });
        installed.push('osc52');
      }
    } catch (e) {}

    /* 2. Copy-on-selection for xterm-owned selections. */
    try {
      if (typeof term.onSelectionChange === 'function') {
        term.onSelectionChange(function () {
          var sel = term.getSelection();
          if (sel && sel.length > 0) writeClipboard(sel);
        });
        installed.push('select');
      }
    } catch (e) {}

    /* 2b. mouseup — reliable copy after drag settles. */
    try {
      var el = term.element || document;
      el.addEventListener('mouseup', function () {
        var sel = term.getSelection();
        if (sel && sel.length > 0) writeClipboard(sel);
      });
      installed.push('mouseup');
    } catch (e) {}

    /* 3. Ctrl+C / Ctrl+V key handling. */
    var prev = term._customKeyEventHandler;
    function copySelection() {
      var sel = term.getSelection();
      if (sel && sel.length > 0) { writeClipboard(sel); term.clearSelection(); return true; }
      return false;
    }
    function pasteClipboard() {
      if (navigator.clipboard && navigator.clipboard.readText) {
        navigator.clipboard.readText().then(function (t) { if (t) term.paste(t); }).catch(function () {});
        return true;
      }
      return false;
    }
    term.attachCustomKeyEventHandler(function (e) {
      if (e.type === 'keydown') {
        /* Sticky Ctrl/Alt/Shift armed via the key toolbar (#8) -- merge into
           the next real keypress, then re-dispatch and swallow the original
           (guarded by `synthesizing` so the re-dispatch doesn't recurse). */
        if (armedActive() && !synthesizing &&
            e.key !== 'Control' && e.key !== 'Alt' && e.key !== 'Shift' && e.key !== 'Meta') {
          var m = consumeArmed();
          e.preventDefault();
          e.stopPropagation();
          sendKey(e.key, e.code, e.keyCode, {
            ctrl: e.ctrlKey || m.ctrl, alt: e.altKey || m.alt, shift: e.shiftKey || m.shift
          });
          return false;
        }
        var mod = (e.ctrlKey || e.metaKey) && !e.altKey;
        if (mod) {
          var k = (e.key || '').toLowerCase();
          if (k === 'c') {
            if (e.shiftKey) { copySelection(); e.preventDefault(); e.stopPropagation(); return false; }
            if (copySelection()) { e.preventDefault(); e.stopPropagation(); return false; }
            return true;
          }
          if (k === 'v') {
            if (pasteClipboard()) { e.preventDefault(); e.stopPropagation(); return false; }
            return true;
          }
        }
      }
      if (typeof prev === 'function') { try { return prev(e); } catch (_) {} }
      return true;
    });
    installed.push('keys');

    /* 4. Touch-based copy (mirrors mouseup for touch screens). */
    try {
      var tel = term.element || document;
      tel.addEventListener('touchend', function () {
        var sel = term.getSelection();
        if (sel && sel.length > 0) writeClipboard(sel);
      });
      installed.push('touch');
    } catch (e) {}

    /* 5. URL link provider — click/tap to open in new tab.
       Works on desktop (hover underline + click) and mobile (tap).
       provideLinks(y) receives the 1-based viewport row; range coords must
       also be viewport-relative (not buffer-absolute). */
    try {
      if (typeof term.registerLinkProvider === 'function') {
        var linkRe = /https?:\/\/[^\s"'<>[\](){}\\]+/g;
        term.registerLinkProvider({
          provideLinks: function (y, cb) {
            try {
              var bufY = term.buffer.active.viewportY + y - 1;
              var line = term.buffer.active.getLine(bufY);
              if (!line) { cb(undefined); return; }
              var text = line.translateToString(true);
              linkRe.lastIndex = 0;
              var m, links = [];
              while ((m = linkRe.exec(text)) !== null) {
                (function (url, col, row) {
                  links.push({
                    range: {
                      start: { x: col + 1,           y: row },
                      end:   { x: col + url.length,  y: row }
                    },
                    text: url,
                    activate: function (_, u) {
                      window.open(u, '_blank', 'noopener,noreferrer');
                    }
                  });
                })(m[0], m.index, y);
              }
              cb(links.length ? links : undefined);
            } catch (e) { cb(undefined); }
          }
        });
        installed.push('links');
      }
    } catch (e) {}

    /* 11. Touch sizing unit -- see header comment. */
    var unit = 1;
    function updateUnit() {
      try {
        var landscape = window.matchMedia && window.matchMedia('(orientation: landscape)').matches;
        var sw = landscape ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
        var lw = document.documentElement.clientWidth || window.innerWidth;
        unit = Math.min(4, Math.max(1, sw ? lw / sw : 1));
        document.documentElement.style.setProperty('--lab-u', unit + 'px');
      } catch (e) {}
    }
    updateUnit();
    window.addEventListener('resize', updateUnit);
    window.addEventListener('orientationchange', function () { setTimeout(updateUnit, 300); });

    /* 6. Mobile panel — floating 📋 button + output / URL panel.
       Only injected on touch-capable devices so desktop layout is untouched.
       The panel contains:
         - a read-only <textarea> with the last 2 screens of terminal text
           (long-press → native selection handles on iOS/Android)
         - a "Copy all" button
         - a tappable list of URLs found in the captured text          */
    try {
      if (navigator.maxTouchPoints > 0 || ('ontouchstart' in window)) {

        /* ── styles ── */
        var style = document.createElement('style');
        style.textContent =
          /* FAB sits above iOS Safari toolbar (~83px on modern iPhones). */
          '#lab-fab{position:fixed;bottom:110px;right:14px;z-index:9999;' +
            'width:54px;height:54px;border-radius:50%;' +
            'border:2px solid rgba(255,255,255,0.22);' +
            'background:rgba(18,18,18,0.95);color:#fff;font-size:24px;' +
            'box-shadow:0 2px 18px rgba(0,0,0,0.65);cursor:pointer;' +
            'display:flex;align-items:center;justify-content:center;' +
            'touch-action:none;user-select:none;}' +
          '#lab-panel{display:none;position:fixed;top:0;left:0;right:0;bottom:0;' +
            'z-index:10000;background:rgba(0,0,0,0.92);' +
            'flex-direction:column;padding:12px;box-sizing:border-box;gap:8px;}' +
          '#lab-panel.open{display:flex;}' +
          '#lab-panel textarea{flex:1;width:100%;background:#1a1a1a;color:#d4d4d4;' +
            'border:1px solid #555;border-radius:6px;padding:8px;' +
            'font-family:"JetBrains Mono",Menlo,Consolas,monospace;font-size:13px;' +
            'resize:none;outline:none;' +
            '-webkit-user-select:text;user-select:text;' +
            '-webkit-touch-callout:default;touch-action:auto;}' +
          '#lab-panel .lab-urls{max-height:28vh;overflow-y:auto;' +
            'background:#111;border:1px solid #333;border-radius:6px;' +
            'padding:6px 8px;display:flex;flex-direction:column;gap:4px;}' +
          '#lab-panel .lab-urls a{color:#4ec9f0;font-size:13px;' +
            'font-family:monospace;word-break:break-all;padding:4px 0;' +
            'text-decoration:none;border-bottom:1px solid #222;}' +
          '#lab-panel .lab-urls a:last-child{border-bottom:none;}' +
          '#lab-panel .lab-urls .lab-no-url{color:#666;font-size:12px;font-style:italic;}' +
          '#lab-panel .lab-row{display:flex;gap:8px;}' +
          '#lab-panel button{flex:1;padding:12px 6px;border:none;border-radius:6px;' +
            'font-size:14px;cursor:pointer;-webkit-tap-highlight-color:transparent;}' +
          '#lab-btn-selall{background:#1e4620;color:#9cdcfe;}' +
          '#lab-btn-copy{background:#0e639c;color:#fff;}' +
          '#lab-btn-close{background:#3c3c3c;color:#fff;}';
        document.head.appendChild(style);

        /* ── FAB button ── */
        var fab = document.createElement('button');
        fab.id = 'lab-fab';
        fab.textContent = '📋';
        fab.setAttribute('aria-label', 'Copy / view terminal output');

        /* ── Panel ── */
        var panel = document.createElement('div');
        panel.id = 'lab-panel';

        var ta = document.createElement('textarea');
        ta.setAttribute('autocomplete', 'off');
        ta.setAttribute('autocorrect', 'off');
        ta.setAttribute('autocapitalize', 'off');
        ta.setAttribute('spellcheck', 'false');

        var urlBox = document.createElement('div');
        urlBox.className = 'lab-urls';

        var row = document.createElement('div');
        row.className = 'lab-row';
        var selAllBtn = document.createElement('button');
        selAllBtn.id = 'lab-btn-selall';
        selAllBtn.textContent = 'Select all';
        var copyBtn = document.createElement('button');
        copyBtn.id = 'lab-btn-copy';
        copyBtn.textContent = 'Copy all';
        var closeBtn = document.createElement('button');
        closeBtn.id = 'lab-btn-close';
        closeBtn.textContent = 'Close';
        row.appendChild(selAllBtn);
        row.appendChild(copyBtn);
        row.appendChild(closeBtn);

        panel.appendChild(ta);
        panel.appendChild(urlBox);
        panel.appendChild(row);

        /* ── helpers ── */
        function getVisibleText() {
          /* Method 1: buffer API — reads ~2 screens around the viewport. */
          try {
            var buf = term.buffer.active;
            var vp   = buf.viewportY;
            var from = Math.max(0, vp - term.rows);
            var to   = vp + term.rows;
            var lines = [];
            for (var i = from; i < to; i++) {
              var ln = buf.getLine(i);
              if (ln) lines.push(ln.translateToString(true));
            }
            while (lines.length && !lines[lines.length - 1].trim()) lines.pop();
            var r1 = lines.join('\n');
            if (r1.trim().length > 0) return r1;
          } catch (e) {}
          /* Method 2: selectAll fallback — whole buffer, last 8 000 chars. */
          try {
            term.selectAll();
            var all = term.getSelection() || '';
            term.clearSelection();
            return all.length > 8000 ? all.slice(-8000) : all;
          } catch (e) {}
          return '';
        }

        function extractUrls(text) {
          var re = /https?:\/\/[^\s"'<>[\](){}\\]+/g;
          var urls = [], m, seen = {};
          while ((m = re.exec(text)) !== null) {
            var u = m[0].replace(/[.,;:!?]+$/, '');
            if (!seen[u]) { seen[u] = true; urls.push(u); }
          }
          return urls;
        }

        function openPanel() {
          var sel = term.getSelection();
          var content = (sel && sel.length > 0) ? sel : getVisibleText();
          ta.value = content;

          /* populate URL list */
          urlBox.innerHTML = '';
          var urls = extractUrls(content);
          if (urls.length === 0) {
            var empty = document.createElement('span');
            empty.className = 'lab-no-url';
            empty.textContent = 'No URLs in visible output';
            urlBox.appendChild(empty);
          } else {
            urls.forEach(function (u) {
              var a = document.createElement('a');
              a.href = u;
              a.target = '_blank';
              a.rel = 'noopener noreferrer';
              a.textContent = u;
              urlBox.appendChild(a);
            });
          }

          panel.classList.add('open');
          /* move cursor to end so the most recent output is visible */
          setTimeout(function () { ta.scrollTop = ta.scrollHeight; }, 50);
        }

        /* ── wire events ── */
        fab.addEventListener('touchstart', function (e) {
          e.preventDefault();
          openPanel();
        }, { passive: false });
        fab.addEventListener('click', openPanel);

        /* "Select all" — focuses textarea and selects everything so iOS/Android
           show the native selection handles + system Copy callout. */
        selAllBtn.addEventListener('click', function () {
          try { ta.focus({ preventScroll: true }); } catch (e) { ta.focus(); }
          ta.setSelectionRange(0, ta.value.length);
        });

        copyBtn.addEventListener('click', function () {
          writeClipboard(ta.value);
          copyBtn.textContent = '✅ Copied!';
          setTimeout(function () { copyBtn.textContent = 'Copy all'; }, 1500);
        });
        closeBtn.addEventListener('click', function () { panel.classList.remove('open'); });
        panel.addEventListener('click', function (e) {
          if (e.target === panel) panel.classList.remove('open');
        });

        document.body.appendChild(fab);
        document.body.appendChild(panel);
        installed.push('mobile-panel');
      }
    } catch (e) {}

    /* 7. Scroll bridge -- see header comment. Only acts on the alternate
       screen; a plain shell prompt (normal buffer) is left to xterm.js's own
       default wheel/scroll handling. */
    try {
      var scrollEl = term.element || document;

      function inAltScreen() {
        try { return term.buffer.active.type === 'alternate'; } catch (e) { return false; }
      }

      function scrollStep(up) {
        if (up) sendKey('PageUp', 'PageUp', 33);
        else sendKey('PageDown', 'PageDown', 34);
      }

      /* One PageUp/PageDown per wheel notch, throttled so a fast trackpad
         flick (which fires many wheel events) doesn't fire a burst of jumps.

         Captured on the terminal's PARENT and stopped there, so xterm.js
         never sees the event. xterm.js has its own wheel listener on
         term.element, and on a buffer with no scrollback -- the alternate
         screen, where tmux always keeps it -- it turns each notch into
         Up/Down ARROW keys for the app. Both fired: PageUp from here scrolled
         Claude Code's transcript while xterm's arrows walked its prompt
         history. A second listener on the same element cannot stop the
         first one (preventDefault doesn't; stopPropagation doesn't), but an
         ancestor's capture-phase listener runs before either and can end
         the event. The normal buffer is untouched, and its events go on to
         xterm's own scrollback. */
      var wheelBusy = false;
      var wheelHost = (term.element && term.element.parentElement) || document;
      wheelHost.addEventListener('wheel', function (e) {
        if (!inAltScreen()) return;
        if (term.element && !term.element.contains(e.target)) return;
        e.preventDefault();
        e.stopPropagation();
        if (wheelBusy || !e.deltaY) return;
        wheelBusy = true;
        scrollStep(e.deltaY < 0);
        setTimeout(function () { wheelBusy = false; }, 150);
      }, { capture: true, passive: false });

      /* Touch-drag -> one PageUp/PageDown per ~120px of movement. "Natural"
         direction: dragging down reveals earlier content (PageUp), matching
         iOS/Android scroll convention.

         touch-action:none + an UNCONDITIONAL preventDefault() on every
         touchmove (not just once the 120px step threshold is crossed) are
         both needed: a real mobile browser decides whether to hand a drag
         to its own native page-pan/scroll based on the FIRST touchmove of
         the gesture. preventDefault()-ing only later touchmove events (once
         enough delta has accumulated) is too late -- native scrolling has
         already taken over the gesture by then, so our own PageUp/PageDown
         steps never had a chance. touch-action:none stops the browser from
         ever engaging native panning here in the first place; the JS
         preventDefault is a second line of defense. */
      scrollEl.style.touchAction = 'none';
      var touchY = null, touchAccum = 0;
      var TOUCH_STEP = 120;
      scrollEl.addEventListener('touchstart', function (e) {
        if (!inAltScreen() || e.touches.length !== 1) { touchY = null; return; }
        touchY = e.touches[0].clientY;
        touchAccum = 0;
      }, { passive: true });
      scrollEl.addEventListener('touchmove', function (e) {
        if (touchY === null || !inAltScreen() || e.touches.length !== 1) return;
        e.preventDefault();
        var curY = e.touches[0].clientY;
        touchAccum += curY - touchY;
        touchY = curY;
        while (Math.abs(touchAccum) >= TOUCH_STEP) {
          scrollStep(touchAccum > 0);
          touchAccum += touchAccum > 0 ? -TOUCH_STEP : TOUCH_STEP;
        }
      }, { passive: false });

      installed.push('scroll-bridge');
    } catch (e) {}

    /* 8. On-screen key toolbar (touch devices only) -- see header comment. */
    try {
      if (navigator.maxTouchPoints > 0 || ('ontouchstart' in window)) {
        var kbStyle = document.createElement('style');
        kbStyle.textContent =
          '#lab-keys-wrap{position:fixed;left:0;right:0;bottom:0;z-index:9998;' +
            'background:rgba(18,18,18,0.95);border-top:1px solid rgba(255,255,255,0.15);}' +
          '#lab-keys,#lab-keys-extra{flex-direction:column;gap:calc(4*var(--lab-u,1px));' +
            'padding:calc(4*var(--lab-u,1px)) calc(6*var(--lab-u,1px));}' +
          '#lab-keys{display:flex;}' +
          /* The extra keys are a row ABOVE the bar, not a sideways scroll: the
             wrap is anchored to the bottom, so opening them grows it upward. */
          '#lab-keys-extra{display:none;border-bottom:1px solid rgba(255,255,255,0.10);}' +
          '#lab-keys-extra.lab-open{display:flex;}' +
          '.lab-key-row{display:flex;flex-wrap:wrap;gap:calc(4*var(--lab-u,1px));}' +
          /* Same 38x32 key as before the rows existed: bigger targets were
             tried and turned down for eating too much of the screen. */
          '.lab-key-row button{flex:0 0 auto;min-width:calc(38*var(--lab-u,1px));' +
            'min-height:calc(32*var(--lab-u,1px));padding:0 calc(9*var(--lab-u,1px));' +
            'border:1px solid rgba(255,255,255,0.22);border-radius:calc(6*var(--lab-u,1px));' +
            'background:#2a2a2a;color:#ddd;font-size:calc(14*var(--lab-u,1px));font-family:monospace;' +
            'cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;}' +
          '.lab-key-row button.lab-key-active{background:#0e639c;color:#fff;border-color:#0e639c;}';
        document.head.appendChild(kbStyle);

        var wrap = document.createElement('div');
        wrap.id = 'lab-keys-wrap';
        var extra = document.createElement('div');
        extra.id = 'lab-keys-extra';
        var bar = document.createElement('div');
        bar.id = 'lab-keys';

        function addRow(parent) {
          var row = document.createElement('div');
          row.className = 'lab-key-row';
          parent.appendChild(row);
          return row;
        }

        function addKeyBtn(row, label, onTap) {
          var b = document.createElement('button');
          b.textContent = label;
          b.addEventListener('touchstart', function (e) { e.preventDefault(); onTap(b); }, { passive: false });
          b.addEventListener('click', function () { onTap(b); });
          row.appendChild(b);
          return b;
        }

        function tapKey(key, code, keyCode) {
          return function () { sendKey(key, code, keyCode, consumeArmed()); };
        }

        var expanded = false;
        function setExpanded(v) {
          expanded = v;
          extra.classList.toggle('lab-open', expanded);
          moreBtn.classList.toggle('lab-key-active', expanded);
          moreBtn.textContent = expanded ? '⌄' : '⌃';
          /* The bar's height just changed: #12 re-measures it on resize and
             moves the terminal's bottom edge to match. */
          window.dispatchEvent(new Event('resize'));
        }

        /* Always on screen, because these are the keys asked for by name:
           Esc / Ctrl / Tab / "/" on one row, the arrows on the row below it
           (closest to the thumb, and the ones reached for most while reading
           a transcript). Everything else is one tap away behind ⌃. */
        var topRow = addRow(bar);
        addKeyBtn(topRow, 'Esc', tapKey('Escape', 'Escape', 27));
        var ctrlBtn = addKeyBtn(topRow, 'Ctrl', function () { setArmed('ctrl', !armed.ctrl); });
        addKeyBtn(topRow, 'Tab', tapKey('Tab', 'Tab', 9));
        addKeyBtn(topRow, '/', tapKey('/', 'Slash', 191));
        var moreBtn = addKeyBtn(topRow, '⌃', function () { setExpanded(!expanded); });

        var arrowRow = addRow(bar);
        addKeyBtn(arrowRow, '←', tapKey('ArrowLeft', 'ArrowLeft', 37));
        addKeyBtn(arrowRow, '↑', tapKey('ArrowUp', 'ArrowUp', 38));
        addKeyBtn(arrowRow, '↓', tapKey('ArrowDown', 'ArrowDown', 40));
        addKeyBtn(arrowRow, '→', tapKey('ArrowRight', 'ArrowRight', 39));

        var extraRow = addRow(extra);
        addKeyBtn(extraRow, 'PgUp', tapKey('PageUp', 'PageUp', 33));
        addKeyBtn(extraRow, 'PgDn', tapKey('PageDown', 'PageDown', 34));
        addKeyBtn(extraRow, 'Home', tapKey('Home', 'Home', 36));
        addKeyBtn(extraRow, 'End', tapKey('End', 'End', 35));
        var altBtn = addKeyBtn(extraRow, 'Alt', function () { setArmed('alt', !armed.alt); });
        var shiftBtn = addKeyBtn(extraRow, 'Shift', function () { setArmed('shift', !armed.shift); });

        armedListeners.push(function () {
          ctrlBtn.classList.toggle('lab-key-active', armed.ctrl);
          altBtn.classList.toggle('lab-key-active', armed.alt);
          shiftBtn.classList.toggle('lab-key-active', armed.shift);
        });

        wrap.appendChild(extra);
        wrap.appendChild(bar);
        document.body.appendChild(wrap);

        installed.push('key-toolbar');
      }
    } catch (e) {}

    /* 12. Keyboard awareness (touch devices only) -- see header comment. */
    try {
      if (navigator.maxTouchPoints > 0 || ('ontouchstart' in window)) {
        var keysWrap = document.getElementById('lab-keys-wrap');
        var termBox = document.getElementById('terminal-container') ||
                      (term.element && term.element.parentElement);
        var lastTermH = -1, layoutQueued = false;

        function layoutAboveKeyboard() {
          layoutQueued = false;
          var vv = window.visualViewport;
          var viewH = vv ? vv.height : window.innerHeight;
          var viewTop = vv ? vv.offsetTop : 0;
          var barH = keysWrap ? keysWrap.offsetHeight : 0;
          if (keysWrap) {
            keysWrap.style.bottom = 'auto';
            keysWrap.style.top = Math.round(viewTop + viewH - barH) + 'px';
          }
          var fabEl = document.getElementById('lab-fab');
          if (fabEl) {
            fabEl.style.bottom = 'auto';
            fabEl.style.top = Math.round(viewTop + viewH - barH - fabEl.offsetHeight - 16) + 'px';
          }
          if (termBox) {
            /* Fixed to the visual viewport's top, so a page iOS scrolled to
               reveal the focused input doesn't push the terminal's top out. */
            termBox.style.position = 'fixed';
            termBox.style.left = '0';
            termBox.style.right = '0';
            termBox.style.top = Math.round(viewTop) + 'px';
            var termH = Math.max(80, Math.round(viewH - barH));
            if (termH !== lastTermH) {
              lastTermH = termH;
              termBox.style.height = termH + 'px';
              /* ttyd refits xterm on window resize; the height check above
                 keeps this event from looping back into another layout. */
              window.dispatchEvent(new Event('resize'));
            }
          }
        }
        function queueLayout() {
          if (layoutQueued) return;
          layoutQueued = true;
          requestAnimationFrame(layoutAboveKeyboard);
        }
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', queueLayout);
          window.visualViewport.addEventListener('scroll', queueLayout);
        }
        window.addEventListener('resize', queueLayout);
        window.addEventListener('orientationchange', function () { setTimeout(queueLayout, 300); });
        layoutAboveKeyboard();
        installed.push('keyboard-aware');
      }
    } catch (e) {}

    /* 9. Auto-reconnect. ttyd's own client (see the served bundle's
       onSocketClose) only auto-retries the websocket when it closes with an
       abnormal code; a *clean* close (code 1000) instead shows a
       "Press <Enter> to Reconnect" overlay and just waits for a real
       keypress. Mobile browsers commonly tear down a backgrounded tab's
       socket with a clean close, so coming back to the tab (or reopening it
       from the OS's recent-tabs list, which can restore the same page
       instance from bfcache) left the terminal looking "stuck" until the
       user did a full page reload. There's no ttyd flag for this, so we
       detect that specific overlay text and synthesize the Enter keypress
       ourselves via the same textarea KeyboardEvent path used above -- xterm
       treats it exactly like the user pressing Enter, which is what the
       overlay's own one-shot listener is waiting for. */
    try {
      function findReconnectOverlay() {
        if (!term.element) return null;
        var kids = term.element.children;
        for (var i = 0; i < kids.length; i++) {
          var txt = kids[i].textContent || '';
          if (txt.indexOf('Press') !== -1 && txt.indexOf('Reconnect') !== -1) return kids[i];
        }
        return null;
      }
      function tryAutoReconnect() {
        if (findReconnectOverlay()) sendKey('Enter', 'Enter', 13);
      }
      setInterval(tryAutoReconnect, 800);
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) tryAutoReconnect();
      });
      window.addEventListener('pageshow', tryAutoReconnect);
      window.addEventListener('focus', tryAutoReconnect);
      window.addEventListener('online', tryAutoReconnect);
      installed.push('auto-reconnect');

      /* 10. Stuck-connection watchdog -- see header comment. */
      var RELOAD_KEY = 'lab-kbfix-reloads';
      var STUCK_MS = 12000;
      var stuckSince = 0;

      /* ttyd's overlay is a child of term.element. "Connection Closed" and
         "Reconnecting..." both mean no live socket; "Reconnected" (shown for
         300ms on success) must NOT match, hence the exact strings.
         ttyd's OverlayAddon reuses ONE node and fades it with opacity rather
         than clearing its text, so also require it to be visible -- otherwise
         a stale faded message would read as a permanent disconnect and put
         the tab in a reload loop. */
      function disconnectedOverlay() {
        if (!term.element) return false;
        var kids = term.element.children;
        for (var i = 0; i < kids.length; i++) {
          var el = kids[i];
          var txt = el.textContent || '';
          var hit = txt.indexOf('Connection Closed') !== -1 ||
                    txt.indexOf('Reconnecting...') !== -1 ||
                    (txt.indexOf('Press') !== -1 && txt.indexOf('Reconnect') !== -1);
          if (!hit) continue;
          try {
            var st = window.getComputedStyle(el);
            if (st.opacity === '0' || st.display === 'none' || st.visibility === 'hidden') continue;
          } catch (e) {}
          return true;
        }
        return false;
      }

      function reloadBudgetLeft() {
        try {
          var now = Date.now();
          var hist = JSON.parse(sessionStorage.getItem(RELOAD_KEY) || '[]')
            .filter(function (t) { return now - t < 120000; });
          if (hist.length >= 3) return false;
          hist.push(now);
          sessionStorage.setItem(RELOAD_KEY, JSON.stringify(hist));
          return true;
        } catch (e) { return true; }  /* no sessionStorage → don't block the reload */
      }

      /* Once a reload is under way this document is finished -- firing another
         would ABORT the in-flight navigation and start over. That matters
         because the reload can legitimately take a while: if the harness was
         idle-stopped, its /verify blocks while the container cold-starts (up
         to a minute for claude, which re-registers ~26 MCP servers before ttyd
         listens), and the old page stays visible, overlay and all, the whole
         time. Reloading on a timer through that window would cancel the very
         request that is waking the container. */
      var reloading = false;

      setInterval(function () {
        if (reloading) return;
        /* A hidden tab is expected to be disconnected; don't reload it, and
           don't let its time away count towards the stuck window either. */
        if (document.hidden || !disconnectedOverlay()) { stuckSince = 0; return; }
        if (!stuckSince) { stuckSince = Date.now(); return; }
        if (Date.now() - stuckSince < STUCK_MS) return;
        stuckSince = 0;
        if (reloadBudgetLeft()) {
          reloading = true;
          try { console.log('[lab-kbfix] terminal stuck disconnected — reloading'); } catch (_) {}
          location.reload();
        }
      }, 1000);
      installed.push('stuck-watchdog');
    } catch (e) {}

    try { console.log('[lab-kbfix] handlers: ' + installed.join(', ')); } catch (_) {}
  });
})();
</script>
