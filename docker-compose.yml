name: harnesses

# Build the base image first so per-harness `FROM harness-base:latest` works:
#   docker compose build harness-base
# Then bring everything up:
#   docker compose up -d auth                  # always-on
# The 11 harness services live under the `on-demand` profile so they do not
# auto-start.  The auth service starts them on first authenticated request and
# stops them after IDLE_TIMEOUT_MIN minutes idle.

x-harness-defaults: &harness-defaults
  restart: "no"
  profiles: ["on-demand"]
  env_file: .env
  volumes:
    - ./project:/workspace
    - ./data:/workspace/data
    # Shared tmux config (mouse select + scrollback + clipboard) and the ttyd
    # in-page clipboard handler (ttyd-kbfix.html). Bind-mounted so copy/paste
    # tweaks need no image rebuild. Harnesses that override `volumes` re-list
    # both lines themselves.
    - ./harnesses/base/tmux.conf:/root/.tmux.conf:ro
    - ./harnesses/base/ttyd-kbfix.html:/opt/ttyd-kbfix.html:ro
  networks:
    - harnesses_net

# All vars come from .env via env_file; the anchors below just rename them
# into the conventional SDK env names per protocol family.
x-anthropic-env: &anthropic-env
  # Route via the auth service's /anthropic proxy: it injects
  # reasoning.exclude=true so OpenRouter doesn't return thinking blocks
  # (which Claude Code's content accumulator handles incorrectly).
  ANTHROPIC_BASE_URL: http://harnesses-auth:8080/anthropic
  # Claude Code 2.x: ANTHROPIC_API_KEY *triggers* the Anthropic OAuth login
  # flow (the SDK treats it as "I have an Anthropic-issued key, validate it").
  # ANTHROPIC_AUTH_TOKEN is the bearer-style override that says "I'm pointed
  # at a non-Anthropic endpoint, send this Authorization header verbatim".
  # Setting AUTH_TOKEN bypasses the interactive login screen.
  ANTHROPIC_AUTH_TOKEN: ${PROVIDER_API_KEY}
  ANTHROPIC_CUSTOM_MODEL_OPTION: ${MODEL_NAME}
  ANTHROPIC_DEFAULT_HAIKU_MODEL: ${MODEL_NAME}
  ANTHROPIC_DEFAULT_SONNET_MODEL: ${MODEL_NAME}
  ANTHROPIC_DEFAULT_OPUS_MODEL: ${MODEL_NAME}
  CLAUDE_CODE_SUBAGENT_MODEL: ${MODEL_NAME}

x-openai-env: &openai-env
  # Route OpenAI-protocol harnesses through the auth-service proxy so they get
  # (a) a free-only, self-updating /v1/models catalog in their pickers and
  # (b) automatic fallback across free models on rate-limit / deprecation.
  # The harness still sends PROVIDER_API_KEY as the bearer; the proxy forwards
  # it to OpenRouter verbatim.  To revert to talking to OpenRouter directly,
  # set these back to ${PROVIDER_BASE_URL} / ${PROVIDER_ANTHROPIC_URL}.
  OPENAI_API_BASE: http://harnesses-auth:8080/v1
  OPENAI_BASE_URL: http://harnesses-auth:8080/v1
  OPENAI_API_KEY: ${PROVIDER_API_KEY}
  # Goose reads OPENAI_HOST as host-without-/v1; it appends /v1 itself.
  OPENAI_HOST: http://harnesses-auth:8080

services:
  # Hidden image-only service so `docker compose build harness-base` works.
  # No container is ever created (profile is unreachable in normal use).
  harness-base:
    image: harness-base:latest
    build:
      context: ./harnesses/base
    profiles: ["build-only"]
    command: ["true"]

  # Free web search/fetch MCP (DuckDuckGo, no API key).  Always-on sidecar on
  # harnesses_net; every harness registers it by URL (WEB_MCP_URL) the same way
  # it registers the Folio MCP.  Exposes `search` and `fetch_content` tools.
  web-mcp:
    build: ./web-mcp
    image: harness-web-mcp:latest
    container_name: web-mcp
    restart: unless-stopped
    environment:
      DDG_SAFE_SEARCH: ${DDG_SAFE_SEARCH:-MODERATE}
    networks:
      - harnesses_net

  auth:
    build: ./auth
    image: harnesses-auth:latest
    container_name: harnesses-auth
    restart: unless-stopped
    env_file: .env
    environment:
      JWT_SECRET: ${JWT_SECRET}
      IDLE_TIMEOUT_MIN: ${IDLE_TIMEOUT_MIN:-30}
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
      MAX_INSTANCES_PER_HARNESS: ${MAX_INSTANCES_PER_HARNESS:-5}
      HARNESS_BASE_DOMAIN: ${HARNESS_BASE_DOMAIN:-lab.example.com}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Bind-mount .env so the auth service can auto-fill empty TOKEN_*= lines
      # at startup and log the login URL for every harness.  RW because the
      # autofill writes regenerated tokens back so the operator can copy them
      # from .env directly (instead of having to read docker logs).
      - ./.env:/app/.env:rw
      # Persisted state — multi-instance metadata (last seen, pinned flag,
      # creation time) survives auth-service restarts.  Without this, every
      # restart would lose track of which dynamic instances exist and the
      # retention sweep would forget what to clean up.
      - harnesses_data:/data
    networks:
      - harnesses_net

  # Self-hosted plandex backend so the harness-plandex CLI doesn't need a
  # plandex.ai cloud account.  LOCAL_MODE=1 disables the auth/trial flow.
  plandex-postgres:
    image: postgres:16-alpine
    container_name: plandex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: plandex
      POSTGRES_USER: plandex
      POSTGRES_DB: plandex
    volumes:
      - ./history/plandex/db:/var/lib/postgresql/data
    networks:
      - harnesses_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plandex"]
      interval: 5s
      timeout: 3s
      retries: 10

  plandex-server:
    image: plandexai/plandex-server:latest
    container_name: plandex-server
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://plandex:plandex@plandex-postgres:5432/plandex?sslmode=disable
      GOENV: development           # required (with LOCAL_MODE) for /accounts to skip email verification
      LOCAL_MODE: "1"
      PLANDEX_BASE_DIR: /plandex-server
      # plandex-server reads credentials by hard-coded env-var names — alias
      # our generic PROVIDER_API_KEY into the provider-specific slots so the
      # built-in model packs (--oss, --strong, etc.) and any custom models
      # routed through OpenRouter can authenticate.
      OPENROUTER_API_KEY: ${PROVIDER_API_KEY}
    volumes:
      - ./history/plandex/files:/plandex-server
    networks:
      - harnesses_net
    depends_on:
      plandex-postgres:
        condition: service_healthy
    command: ["/bin/sh", "-c", "/scripts/wait-for-it.sh plandex-postgres:5432 -- ./plandex-server"]

  # Web-based file manager for project/, data/, and history/ — reuses the
  # exact same subdomain + JWT/cookie auth as every CLI harness below (see
  # UTILITY_SERVICES in auth/server.py: /verify treats "files" as a normal
  # single-instance harness type, just like "claude" or "aider"). Unlike
  # those, it's always-on rather than on-demand: it's lightweight, and
  # there's no per-visitor terminal state worth idle-stopping. dufs has no
  # auth of its own unless `-a` is passed, which is safe here for the same
  # reason ttyd itself has no login of its own — Caddy's forward_auth + JWT
  # cookie already gates every request before it reaches this container.
  # (Chose dufs over filebrowser/filebrowser after finding the latter
  # announces its own archival on 2026-09-01, no further security fixes.)
  harness-files:
    image: sigoden/dufs:latest
    container_name: harness-files
    restart: unless-stopped
    command:
      - --bind=0.0.0.0
      - --port=7681
      - --allow-all
      - /srv
    volumes:
      - ./project:/srv/project
      - ./data:/srv/data
      - ./history:/srv/history
    networks:
      - harnesses_net

  harness-claude:
    <<: *harness-defaults
    build: ./harnesses/claude
    image: harness-claude:latest
    container_name: harness-claude
    # Persist session history (~/.claude: transcripts, history.jsonl, sessions)
    # across rebuilds/recreates. Configs are re-seeded each boot by the
    # entrypoint, so only data lives here — safe to keep on a named volume.
    volumes:
      - ./project:/workspace
      - ./data:/workspace/data
      - ./history/claude:/root/.claude
      - ./harnesses/base/tmux.conf:/root/.tmux.conf:ro
      - ./harnesses/base/ttyd-kbfix.html:/opt/ttyd-kbfix.html:ro
    environment:
      <<: *anthropic-env

  harness-aider:
    <<: *harness-defaults
    build: ./harnesses/aider
    image: harness-aider:latest
    container_name: harness-aider
    volumes:
      - ./project:/workspace
      - ./data:/workspace/data
      - ./history/aider:/root/.aider                   # chat/input/llm history
      - ./harnesses/base/tmux.conf:/root/.tmux.conf:ro
      - ./harnesses/base/ttyd-kbfix.html:/opt/ttyd-kbfix.html:ro
    environment:
      <<: *openai-env
      MODEL_NAME: ${MODEL_NAME}

  harness-opencode:
    <<: *harness-defaults
    build: ./harnesses/opencode
    image: harness-opencode:latest
    container_name: harness-opencode
    volumes:
      - ./project:/workspace
      - ./data:/workspace/data
      - ./history/opencode/state:/root/.local/share/opencode   # sessions
      - ./history/opencode/hist:/root/.local/state/opencode     # prompt history
      - ./harnesses/base/tmux.conf:/root/.tmux.conf:ro
      - ./harnesses/base/ttyd-kbfix.html:/opt/ttyd-kbfix.html:ro
    environment:
      <<: *openai-env
      MODEL_NAME: ${MODEL_NAME}

  harness-crush:
    <<: *harness-defaults
    build: ./harnesses/crush
    image: harness-crush:latest
    container_name: harness-crush
    volumes:
      - ./project:/workspace
      - ./data:/workspace/data
      - ./history/crush:/root/.crush-data               # session DB (--data-dir)
      - ./harnesses/base/tmux.conf:/root/.tmux.conf:ro
      - ./harnesses/base/ttyd-kbfix.html:/opt/ttyd-kbfix.html:ro
    # Crush auto-activates its built-in OpenAI provider whenever OPENAI_API_KEY
    # exists in env, ignoring crush.json's lab provider entirely.  Skip the
    # openai-env anchor here so only PROVIDER_* (from env_file) is present.
    environment:
      MODEL_NAME: ${MODEL_NAME}

  harness-gptme:
    <<: *harness-defaults
    build: ./harnesses/gptme
    image: harness-gptme:latest
    container_name: harness-gptme
    volumes:
      - ./project:/workspace
      - ./data:/workspace/data
      - ./history/gptme:/root/.local/share/gptme     # conversation logs
      - ./harnesses/base/tmux.conf:/root/.tmux.conf:ro
      - ./harnesses/base/ttyd-kbfix.html:/opt/ttyd-kbfix.html:ro
    environment:
      <<: *openai-env
      MODEL_NAME: ${MODEL_NAME}

  harness-goose:
    <<: *harness-defaults
    build: ./harnesses/goose
    image: harness-goose:latest
    container_name: harness-goose
    volumes:
      - ./project:/workspace
      - ./data:/workspace/data
      - ./history/goose:/root/.local/share/goose     # sessions
      - ./harnesses/base/tmux.conf:/root/.tmux.conf:ro
      - ./harnesses/base/ttyd-kbfix.html:/opt/ttyd-kbfix.html:ro
    environment:
      <<: *openai-env
      MODEL_NAME: ${MODEL_NAME}

  harness-plandex:
    <<: *harness-defaults
    build: ./harnesses/plandex
    image: harness-plandex:latest
    container_name: harness-plandex
    environment:
      <<: *openai-env
      MODEL_NAME: ${MODEL_NAME}
      # Point the CLI at our self-hosted server (LOCAL_MODE=1, no account).
      PLANDEX_API_HOST: http://plandex-server:8099
      # Plandex's CLI gate-keeps model-pack selection by checking for the
      # provider-specific env var (OPENROUTER_API_KEY etc.) — alias our key.
      OPENROUTER_API_KEY: ${PROVIDER_API_KEY}
      # Do NOT set DEEPSEEK_API_KEY — plandex auto-routes through OpenRouter
      # only when there's no provider-specific key.  Setting a non-DeepSeek
      # key as DEEPSEEK_API_KEY makes LiteLLM call api.deepseek.com and fail.
    depends_on:
      plandex-server:
        condition: service_started

  harness-qwencode:
    <<: *harness-defaults
    build: ./harnesses/qwencode
    image: harness-qwencode:latest
    container_name: harness-qwencode
    volumes:
      - ./project:/workspace
      - ./data:/workspace/data
      - ./history/qwencode:/root/.qwen                # chat history + settings
      - ./harnesses/base/tmux.conf:/root/.tmux.conf:ro
      - ./harnesses/base/ttyd-kbfix.html:/opt/ttyd-kbfix.html:ro
    environment:
      <<: *openai-env
      MODEL_NAME: ${MODEL_NAME}

  harness-codex:
    <<: *harness-defaults
    build: ./harnesses/codex
    image: harness-codex:latest
    container_name: harness-codex
    volumes:
      - ./project:/workspace
      - ./data:/workspace/data
      - ./history/codex:/root/.codex                  # sessions (config re-seeded each boot)
      - ./harnesses/base/tmux.conf:/root/.tmux.conf:ro
      - ./harnesses/base/ttyd-kbfix.html:/opt/ttyd-kbfix.html:ro
    environment:
      <<: *openai-env
      MODEL_NAME: ${MODEL_NAME}

  harness-pi:
    <<: *harness-defaults
    build: ./harnesses/pi
    image: harness-pi:latest
    container_name: harness-pi
    environment:
      <<: *openai-env
      MODEL_NAME: ${MODEL_NAME}

  harness-droid:
    <<: *harness-defaults
    build: ./harnesses/droid
    image: harness-droid:latest
    container_name: harness-droid
    volumes:
      - ./project:/workspace
      - ./data:/workspace/data
      - ./history/droid:/root/.factory                # sessions (settings/mcp re-seeded each boot)
      - ./harnesses/base/tmux.conf:/root/.tmux.conf:ro
      - ./harnesses/base/ttyd-kbfix.html:/opt/ttyd-kbfix.html:ro
    environment:
      <<: *anthropic-env
      # NOTE: as of droid (Factory CLI) v0.143 the *interactive* TUI requires a
      # Factory account device-login and no longer accepts a fake FACTORY_API_KEY
      # to bypass it (older versions did). BYOK still works fully NON-interactively
      # via `droid exec ...`, which uses the customModels apiKey in
      # ~/.factory/settings.json. We keep FACTORY_API_KEY set for that path.
      FACTORY_API_KEY: byok-${PROVIDER_API_KEY:-not-used}

networks:
  harnesses_net:
    name: harnesses_net
    driver: bridge

volumes:
  # Persisted auth state — instances.json (per-instance retention metadata).
  # Kept across `docker compose down` so multi-instance bookkeeping survives.
  harnesses_data:
  # Per-harness session-history state used to live in one opaque Docker named
  # volume per harness (claude_state, codex_state, plandex_db, etc). All of it
  # now lives under ./history/<harness>/ instead (bind mount, see the per-service
  # volumes: entries above) -- ONE visible, backup-able directory tree on the
  # host for every harness's conversation history, instead of N volumes hidden
  # under /var/lib/docker/volumes. Survives rebuilds/recreates AND `docker
  # compose down` the same way named volumes did; only `rm -rf ./history/<x>`
  # can lose it now, same as any other file on disk.
